name: tests

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        ts: [nts, zts]
        # Security floor (composer.json "php": "~8.4.27||^8.5.12"): each line's lowest patched release.
        include:
          - php: '8.4'
            min: '8.4.27'
          - php: '8.5'
            min: '8.5.12'

    name: PHP ${{ matrix.php }} ${{ matrix.ts }}

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pcntl, posix
          coverage: none
        env:
          phpts: ${{ matrix.ts == 'zts' && 'ts' || 'nts' }}
          # the newest patch of the line, never a cached older build
          update: true

      - name: Refuse a PHP below the patched floor
        env:
          PHP_FLOOR: ${{ matrix.min }}
        run: |
          php -r 'if (version_compare(PHP_VERSION, getenv("PHP_FLOOR"), "<")) { fwrite(STDERR, "PHP ".PHP_VERSION." is below the patched floor ".getenv("PHP_FLOOR").PHP_EOL); exit(1); } echo "PHP ".PHP_VERSION.PHP_EOL;'

      - name: Refuse a build of the wrong thread safety
        env:
          WANT_ZTS: ${{ matrix.ts == 'zts' && '1' || '0' }}
        run: |
          php -r 'if ((int) PHP_ZTS !== (int) getenv("WANT_ZTS")) { fwrite(STDERR, "PHP_ZTS is ".(int) PHP_ZTS.", wanted ".getenv("WANT_ZTS").PHP_EOL); exit(1); }'

      - name: Install Composer dependencies
        run: composer update --prefer-stable --no-interaction --no-progress

      - name: Execute tests
        run: vendor/bin/pest
